[project]
name = "ntop-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for nTop (nTopology) notebook inspection, block graph editing, headless nTop Automate (ntopcl) execution, parameter sweeps, and mesh analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ntop-mcp = "ntop_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
